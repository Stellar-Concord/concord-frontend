name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        # --legacy-peer-deps: stellar-wallets-kit pulls in optional
        # multi-chain wallet adapters (e.g. @hot-wallet/sdk -> @solana/web3.js)
        # whose peer dependency graph npm's strict resolver can't untangle.
        # Unrelated to our own code; installs cleanly either way.
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
